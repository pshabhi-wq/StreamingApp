apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streaming-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: {{ .Values.ingress.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-svc
            port:
              number: 80
      - path: /api/auth
        pathType: Prefix
        backend:
          service:
            name: auth-svc
            port:
              number: 3001
      - path: /api/streaming
        pathType: Prefix
        backend:
          service:
            name: stream-svc
            port:
              number: 3002
      - path: /api/admin
        pathType: Prefix
        backend:
          service:
            name: admin-svc
            port:
              number: 3003
      - path: /api/chat
        pathType: Prefix
        backend:
          service:
            name: chat-svc
            port:
              number: 3004
